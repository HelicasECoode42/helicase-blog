<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f5f6f8"/>
  <!-- Neon pulse -->
  <rect x="80" y="120" width="240" height="160" fill="none" stroke="#334ed5" stroke-width="1"/>
  <rect x="100" y="140" width="200" height="120" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.5"/>
  <!-- Grid overlay -->
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.5" fill="#d8dbe0" opacity="0.5"/>
  </pattern>
  <rect width="400" height="400" fill="url(#g)" opacity="0.4"/>
  <!-- Center burst -->
  <line x1="200" y1="60" x2="200" y2="340" stroke="#334ed5" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#334ed5" stroke-width="0.5" opacity="0.3"/>
  <circle cx="200" cy="200" r="40" fill="none" stroke="#c8ff00" stroke-width="0.5" opacity="0.4"/>
  <text x="200" y="370" font-family="monospace" font-size="12" fill="#1a3a5c" text-anchor="middle" letter-spacing="4">BLINDING LIGHTS</text>
</svg>
