<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f5f6f8"/>
  <!-- Webbed / connected -->
  <circle cx="200" cy="160" r="90" fill="none" stroke="#d8dbe0" stroke-width="0.5"/>
  <circle cx="140" cy="240" r="40" fill="none" stroke="#334ed5" stroke-width="0.5" opacity="0.4"/>
  <circle cx="260" cy="240" r="40" fill="none" stroke="#334ed5" stroke-width="0.5" opacity="0.4"/>
  <!-- Connection lines -->
  <line x1="200" y1="160" x2="140" y2="240" stroke="#b0b3b8" stroke-width="0.5" opacity="0.5"/>
  <line x1="200" y1="160" x2="260" y2="240" stroke="#b0b3b8" stroke-width="0.5" opacity="0.5"/>
  <line x1="140" y1="240" x2="260" y2="240" stroke="#d8dbe0" stroke-width="0.3" opacity="0.3"/>
  <!-- Center point -->
  <circle cx="200" cy="160" r="4" fill="#1a3a5c" opacity="0.6"/>
  <text x="200" y="350" font-family="monospace" font-size="11" fill="#1a3a5c" text-anchor="middle" letter-spacing="4">DUVET</text>
  <text x="200" y="368" font-family="monospace" font-size="8" fill="#b0b3b8" text-anchor="middle" letter-spacing="2">BÔA</text>
</svg>
