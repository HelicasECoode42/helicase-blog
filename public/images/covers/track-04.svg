<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#1a3a5c"/>
  <!-- Night runner -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#334ed5" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#d8dbe0" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#334ed5" stroke-width="0.5" opacity="0.3"/>
  <!-- Speed lines -->
  <rect x="50" y="140" width="120" height="3" fill="#c8ff00" opacity="0.3"/>
  <rect x="150" y="240" width="80" height="2" fill="#c8ff00" opacity="0.2"/>
  <rect x="80" y="340" width="100" height="2" fill="#334ed5" opacity="0.3"/>
  <!-- Moon -->
  <circle cx="340" cy="80" r="30" fill="none" stroke="#f5f6f8" stroke-width="0.5" opacity="0.5"/>
  <text x="200" y="390" font-family="monospace" font-size="10" fill="#b0b3b8" text-anchor="middle" letter-spacing="3">夜ニ駆ケル</text>
</svg>
