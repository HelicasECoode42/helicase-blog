<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0f1117"/>
  <!-- Cyberpunk sunset -->
  <circle cx="280" cy="180" r="80" fill="none" stroke="#334ed5" stroke-width="1" opacity="0.6"/>
  <circle cx="280" cy="180" r="60" fill="#334ed5" opacity="0.08"/>
  <circle cx="280" cy="180" r="20" fill="#c8ff00" opacity="0.7"/>
  <!-- Grid -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#d8dbe0" stroke-width="0.3" opacity="0.3"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#d8dbe0" stroke-width="0.3" opacity="0.3"/>
  <!-- City silhouette -->
  <rect x="40" y="260" width="8" height="60" fill="#1a3a5c" opacity="0.6"/>
  <rect x="60" y="230" width="12" height="90" fill="#1a3a5c" opacity="0.4"/>
  <rect x="85" y="280" width="6" height="40" fill="#1a3a5c" opacity="0.5"/>
  <rect x="100" y="200" width="10" height="120" fill="#1a3a5c" opacity="0.3"/>
  <!-- Title text -->
  <text x="50" y="50" font-family="monospace" font-size="10" fill="#b0b3b8" letter-spacing="3">I REALLY WANT TO STAY</text>
  <text x="50" y="65" font-family="monospace" font-size="10" fill="#334ed5" letter-spacing="3">AT YOUR HOUSE</text>
</svg>
